<!DOCTYPE html>
<html>
<head>
    <title>My Game Hub</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        header {
            background: #222;
            padding: 30px;
        }

        h1 {
            margin: 0;
            font-size: 40px;
        }

        .games {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 40px;
        }

        .game {
            background: #222;
            width: 250px;
            padding: 20px;
            border-radius: 15px;
        }

        .game img {
            width: 100%;
            border-radius: 10px;
        }

        .game a {
            display: block;
            margin-top: 15px;
            padding: 12px;
            background: #444;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .game a:hover {
            background: #666;
        }
    </style>
</head>

<body>

<header>
    <h1>🎮 My Game Hub</h1>
    <p>Play my games!</p>
</header>

<div class="games">

    <div class="game">
        <h2>Game 1</h2>
        <p>My first game</p>
        <a href="#">PLAY</a>
    </div>

    <div class="game">
        <h2>Game 2</h2>
        <p>Another game</p>
        <a href="#">PLAY</a>
    </div>

    <div class="game">
        <h2>Game 3</h2>
        <p>Coming soon</p>
        <a href="#">PLAY</a>
    </div>

</div>

</body>
</html>
