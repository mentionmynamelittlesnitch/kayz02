<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Wheelie Challenge</title><link rel="stylesheet" href="style.css"></head>
<body><div class="page-wrap"><a class="back" href="index.html">← Back to Game Hub</a><section class="panel"><p class="eyebrow">MINI GAME</p><h1>🏍️ Wheelie Challenge</h1><p class="muted">Hold the button or press Space to lift the front wheel. Keep the bike balanced and don't let it tip too far!</p>
<div style="background:#07101d;border:1px solid #2b4565;border-radius:12px;overflow:hidden"><canvas id="game" width="850" height="330" style="display:block;width:100%;height:auto;touch-action:manipulation"></canvas></div>
<div class="controls" style="margin-top:16px"><button id="wheelie">HOLD TO WHEELIE (SPACE)</button><button class="secondary" id="restart">RESTART</button><strong id="score">Distance: 0 m</strong></div><p class="status" id="status">Press and hold the wheelie button or Space to start.</p></section></div><script src="wheelie.js"></script></body></html>
